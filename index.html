<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import RAPIER from '@dimforge/rapier3d-compat';

// ==PHYS-START==
// ---------------------------------------------------------------
// Physics: arena colliders, props, physical hands, grabbing
// ---------------------------------------------------------------
const HALF = 6;          // arena half-size in metres
const WALL_H = 5;        // visible wall height
const PHYS_WALL_H = 10;  // invisible physics walls go higher so nothing escapes
const STEP_BOXES = [
  { x0: -4,   x1: 4,   z0: -6,   z1: -3.6, top: 0.9 },  // back platform
  { x0: -1.2, x1: 1.2, z0: -3.6, z1: -3.2, top: 0.6 },  // stairs
  { x0: -1.2, x1: 1.2, z0: -3.2, z1: -2.8, top: 0.3 },
  { x0: 4,    x1: 6,   z0: -0.5, z1: 3,    top: 0.5 }   // side ledge
];

const GRAV = 9.81;
const HAND_MASS = 4;          // kg
const HAND_MAX_FORCE = 900;   // N, how strong the hands are
const HAND_LIN_GAIN = 25;
const HAND_ANG_GAIN = 25;
const HAND_MAX_SPEED = 25;    // m/s
const HAND_MAX_ANG = 30;      // rad/s
const REACH = 0.1;            // how far from the hand you can grab (m)
// Collision groups: high 16 bits = what a collider is, low 16 bits = what it can touch.
// Hands touch the world, props, flesh and blades but not each other. Blade edges pass through
// flesh (the slicing code cuts instead), so blades and flesh never touch each other.
const HAND_GROUPS = ((0x0002 << 16) | 0x0031) >>> 0;
const FLESH_GROUPS = ((0x0010 << 16) | 0xFFDF) >>> 0;
const BLADE_GROUPS = ((0x0020 << 16) | 0xFFEF) >>> 0;
const BLADE_MIN_SPEED = 0.6;  // m/s an edge must move to cut
const CUT_DEPTH = 0.012;      // m the edge must be inside a body part before it cuts
const WEAPON_TILT = 0.55;     // how far weapons tilt forward in your fist (rad)

let world = null;
let eventQueue = null;
const props = [];
const hands = [];
const limbBodies = [];        // ragdoll limbs you can grab
const owners = new Map();     // collider handle -> what it belongs to (for hit detection)

function addStaticBox(cx, cy, cz, hx, hy, hz) {
  const body = world.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(cx, cy, cz));
  world.createCollider(RAPIER.ColliderDesc.cuboid(hx, hy, hz).setFriction(0.9).setRestitution(0.1), body);
  return body;
}

function initPhysics() {
  world = new RAPIER.World({ x: 0, y: -GRAV, z: 0 });
  eventQueue = new RAPIER.EventQueue(true);
  addStaticBox(0, -0.5, 0, HALF + 1, 0.5, HALF + 1);                       // floor
  const wy = PHYS_WALL_H / 2;
  addStaticBox(0, wy, -HALF - 0.25, HALF + 1, wy, 0.25);                   // walls
  addStaticBox(0, wy, HALF + 0.25, HALF + 1, wy, 0.25);
  addStaticBox(-HALF - 0.25, wy, 0, 0.25, wy, HALF + 1);
  addStaticBox(HALF + 0.25, wy, 0, 0.25, wy, HALF + 1);
  addStaticBox(0, PHYS_WALL_H + 0.5, 0, HALF + 1, 0.5, HALF + 1);          // invisible ceiling
  for (const s of STEP_BOXES) {
    addStaticBox((s.x0 + s.x1) / 2, s.top / 2, (s.z0 + s.z1) / 2,
                 (s.x1 - s.x0) / 2, s.top / 2, (s.z1 - s.z0) / 2);
  }
}

function makeColliderDesc(part) {
  let cd;
  if (part.shape === 'box') cd = RAPIER.ColliderDesc.cuboid(part.size[0] / 2, part.size[1] / 2, part.size[2] / 2);
  else if (part.shape === 'cyl') cd = RAPIER.ColliderDesc.cylinder(part.size[1] / 2, part.size[0]);
  else if (part.shape === 'cap') cd = RAPIER.ColliderDesc.capsule(part.size[1], part.size[0]);
  else cd = RAPIER.ColliderDesc.ball(part.size[0]);
  if (part.offset) cd.setTranslation(part.offset[0], part.offset[1], part.offset[2]);
  return cd;
}

// A blade is a row of sample points along a cutting edge (in prop space), the direction of
// the edge (e) and the flat-face normal of the blade (f). The slicing code sweeps these points
// through bodies every physics step.
function makeBlade(b) {
  const pts = b.pts.map(p => new THREE.Vector3(p[0], p[1], p[2]));
  return {
    pts, n: pts.length, e: new THREE.Vector3(b.e[0], b.e[1], b.e[2]), f: new THREE.Vector3(b.f[0], b.f[1], b.f[2]),
    cur: pts.map(() => new THREE.Vector3()), prev: pts.map(() => new THREE.Vector3()), has: false
  };
}

// A prop is one rigid body made of one or more collider parts. Parts can be flagged as
// sharp ("edge") and given a damage multiplier, which is how weapons work.
function addProp(def) {
  const [x, y, z] = def.pos;
  const rot = def.rot || { x: 0, y: 0, z: 0, w: 1 };
  const body = world.createRigidBody(
    RAPIER.RigidBodyDesc.dynamic().setTranslation(x, y, z).setRotation(rot)
      .setLinearDamping(0.03).setAngularDamping(0.25));
  const parts = def.parts || [{ shape: def.shape, size: def.size, mass: def.mass, friction: def.friction, restitution: def.restitution }];
  let half = def.half;
  if (!half) {
    const p0 = parts[0];
    if (p0.shape === 'box') half = { x: p0.size[0] / 2, y: p0.size[1] / 2, z: p0.size[2] / 2 };
    else if (p0.shape === 'cyl') half = { x: p0.size[0], y: p0.size[1] / 2, z: p0.size[0] };
    else half = { x: p0.size[0], y: p0.size[0], z: p0.size[0] };
  }
  const prop = {
    name: def.name || 'prop', shape: def.shape || (parts[0].shape === 'ball' ? 'ball' : 'box'),
    body, mass: 0, mesh: def.mesh || null, colliders: [], half,
    cOff: def.cOff || { x: 0, y: 0, z: 0 }, grip: def.grip || null, snap: !!def.snap,
    holders: 0, blood: 0, bladeMats: def.bladeMats || [], initial: !!def.initial,
    blade: def.blade ? makeBlade(def.blade) : null,
    vPrev: { x: 0, y: 0, z: 0 },
    initPos: { x, y, z }, initRot: { x: rot.x, y: rot.y, z: rot.z, w: rot.w }
  };
  for (const part of parts) {
    const cd = makeColliderDesc(part);
    cd.setMass(part.mass).setFriction(part.friction ?? 0.8).setRestitution(part.restitution ?? 0.05);
    if (part.edge) cd.setCollisionGroups(BLADE_GROUPS);
    const col = world.createCollider(cd, body);
    prop.colliders.push(col);
    prop.mass += part.mass;
    owners.set(col.handle, { kind: 'dealer', prop, col, edge: !!part.edge, dmg: part.dmg ?? 0.22 });
  }
  props.push(prop);
  return prop;
}

function createHand() {
  const body = world.createRigidBody(
    RAPIER.RigidBodyDesc.dynamic().setTranslation(0, 1, 0)
      .setGravityScale(0).setCcdEnabled(true).setCanSleep(false)
      .setLinearDamping(0).setAngularDamping(0));
  const col = world.createCollider(
    RAPIER.ColliderDesc.cuboid(0.04, 0.045, 0.055).setTranslation(0, 0, -0.045)
      .setMass(HAND_MASS).setFriction(1).setRestitution(0).setCollisionGroups(HAND_GROUPS), body);
  const hand = { body, held: [], gripDown: false, vPrev: { x: 0, y: 0, z: 0 } };
  owners.set(col.handle, { kind: 'hand', hand, col });
  hands.push(hand);
  return hand;
}

function heldMass(hand) {
  let m = 0;
  for (const h of hand.held) m += h.prop.mass;
  return m;
}

function releaseHand(hand) {
  for (const h of hand.held) {
    world.removeImpulseJoint(h.joint, true);
    h.prop.holders = Math.max(0, h.prop.holders - 1);
  }
  hand.held.length = 0;
}

// Let go of an object (used when it is deleted).
function releaseHolders(g) {
  for (const hand of hands) {
    for (let i = hand.held.length - 1; i >= 0; i--) {
      if (hand.held[i].prop === g) {
        world.removeImpulseJoint(hand.held[i].joint, true);
        hand.held.splice(i, 1);
      }
    }
  }
  g.holders = 0;
}

function removePropBody(prop) {
  releaseHolders(prop);
  for (const c of prop.colliders) owners.delete(c.handle);
  world.removeRigidBody(prop.body);
  const i = props.indexOf(prop);
  if (i >= 0) props.splice(i, 1);
}

const _c = new THREE.Vector3(), _l = new THREE.Vector3();
const _q1 = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _q3 = new THREE.Quaternion();
const _e = new THREE.Vector3(), _imp = new THREE.Vector3(), _w = new THREE.Vector3();
const _yAxis = new THREE.Vector3(0, 1, 0);

function grabDistance(g, c) {
  const t = g.body.translation(), r = g.body.rotation();
  _q2.set(r.x, r.y, r.z, r.w).invert();
  _l.set(c.x - t.x, c.y - t.y, c.z - t.z).applyQuaternion(_q2);
  const co = g.grip ? g.grip.c : g.cOff;
  _l.set(_l.x - co.x, _l.y - co.y, _l.z - co.z);
  const h = g.grip ? g.grip.h : g.half;
  if (g.shape === 'ball' && !g.grip) return _l.length() - h.x;
  const dx = Math.max(Math.abs(_l.x) - h.x, 0);
  const dy = Math.max(Math.abs(_l.y) - h.y, 0);
  const dz = Math.max(Math.abs(_l.z) - h.z, 0);
  return Math.sqrt(dx * dx + dy * dy + dz * dz);
}

function attach(hand, g) {
  const p = hand.body.translation(), r = hand.body.rotation();
  const hq = new THREE.Quaternion(r.x, r.y, r.z, r.w);
  const hqi = hq.clone().invert();
  const hp = new THREE.Vector3(p.x, p.y, p.z);
  const relPos = new THREE.Vector3();
  const relRot = new THREE.Quaternion();
  if (g.snap && g.holders === 0) {
    // Weapons snap into the fist: handle across the fingers, blade tilted forward.
    const dir = new THREE.Vector3(0, Math.cos(WEAPON_TILT), -Math.sin(WEAPON_TILT));
    relRot.setFromUnitVectors(_yAxis, dir);
    const gc = g.grip ? g.grip.c : { x: 0, y: 0, z: 0 };
    relPos.set(0, 0, -0.045).sub(new THREE.Vector3(gc.x, gc.y, gc.z).applyQuaternion(relRot));
    const wq = hq.clone().multiply(relRot);
    const wp = relPos.clone().applyQuaternion(hq).add(hp);
    g.body.setTranslation({ x: wp.x, y: wp.y, z: wp.z }, true);
    g.body.setRotation({ x: wq.x, y: wq.y, z: wq.z, w: wq.w }, true);
    g.body.setLinvel({ x: 0, y: 0, z: 0 }, true);
    g.body.setAngvel({ x: 0, y: 0, z: 0 }, true);
  } else {
    const pp = g.body.translation(), pq = g.body.rotation();
    relPos.set(pp.x - p.x, pp.y - p.y, pp.z - p.z).applyQuaternion(hqi);
    relRot.copy(hqi).multiply(new THREE.Quaternion(pq.x, pq.y, pq.z, pq.w));
  }
  const params = RAPIER.JointData.fixed(
    { x: relPos.x, y: relPos.y, z: relPos.z }, { x: relRot.x, y: relRot.y, z: relRot.z, w: relRot.w },
    { x: 0, y: 0, z: 0 }, { x: 0, y: 0, z: 0, w: 1 });
  const joint = world.createImpulseJoint(params, hand.body, g.body, true);
  joint.setContactsEnabled(false);
  g.body.wakeUp();
  g.holders++;
  hand.held.push({ prop: g, joint });
}

function tryGrab(hand) {
  const p = hand.body.translation(), r = hand.body.rotation();
  _q1.set(r.x, r.y, r.z, r.w);
  _c.set(0, 0, -0.045).applyQuaternion(_q1);
  _c.set(p.x + _c.x, p.y + _c.y, p.z + _c.z);   // centre of the palm/fist
  let best = null, bestD = REACH;
  for (const list of [props, limbBodies]) {
    for (const g of list) {
      if (hand.held.some(h => h.prop === g)) continue;
      const d = grabDistance(g, _c);
      if (d < bestD) { bestD = d; best = g; }
    }
  }
  if (!best) return false;
  attach(hand, best);
  return true;
}

// Pull the hand body toward the real controller pose. The force is capped, so heavy
// held objects make the hand lag behind the controller. That is what gives weight.
function driveHand(hand, dt, tPos, tQuat) {
  const b = hand.body;
  const p = b.translation(), v = b.linvel(), r = b.rotation();
  _e.set(tPos.x - p.x, tPos.y - p.y, tPos.z - p.z);
  const dist = _e.length();
  if (dist > 1.2) {                       // lost tracking / teleported: snap back
    releaseHand(hand);
    b.setTranslation({ x: tPos.x, y: tPos.y, z: tPos.z }, true);
    b.setRotation({ x: tQuat.x, y: tQuat.y, z: tQuat.z, w: tQuat.w }, true);
    b.setLinvel({ x: 0, y: 0, z: 0 }, true);
    b.setAngvel({ x: 0, y: 0, z: 0 }, true);
    return;
  }
  const hm = heldMass(hand);
  const M = HAND_MASS + hm;
  _imp.copy(_e).multiplyScalar(HAND_LIN_GAIN);
  if (_imp.length() > HAND_MAX_SPEED) _imp.setLength(HAND_MAX_SPEED);
  _imp.set(_imp.x - v.x, _imp.y - v.y, _imp.z - v.z).multiplyScalar(M);
  _imp.y += hm * GRAV * dt * 0.92;        // carry most of the held weight
  const maxImp = HAND_MAX_FORCE * dt;
  if (_imp.length() > maxImp) _imp.setLength(maxImp);
  b.applyImpulse({ x: _imp.x, y: _imp.y, z: _imp.z }, true);

  _q1.set(r.x, r.y, r.z, r.w).invert();
  _q2.copy(tQuat).multiply(_q1);
  if (_q2.w < 0) { _q2.x = -_q2.x; _q2.y = -_q2.y; _q2.z = -_q2.z; _q2.w = -_q2.w; }
  const angle = 2 * Math.acos(Math.min(1, _q2.w));
  const s = Math.sqrt(Math.max(0, 1 - _q2.w * _q2.w));
  if (s < 1e-4) _w.set(0, 0, 0); else _w.set(_q2.x / s, _q2.y / s, _q2.z / s).multiplyScalar(angle * HAND_ANG_GAIN);
  if (_w.length() > HAND_MAX_ANG) _w.setLength(HAND_MAX_ANG);
  _w.multiplyScalar(1 / (1 + 0.04 * hm));
  b.setAngvel({ x: _w.x, y: _w.y, z: _w.z }, true);
}

function groundAt(x, z) {
  let h = 0;
  for (const s of STEP_BOXES) if (x >= s.x0 && x <= s.x1 && z >= s.z0 && z <= s.z1) h = Math.max(h, s.top);
  return h;
}
// ==PHYS-END==

// ==SLICE-MATH-START==
// ---------------------------------------------------------------
// Slicing maths. Plain arrays only, no three.js. A "soup" is a closed convex solid stored as
// triangles: `sk` is the skin and `cp` the cut faces. Each vertex is 6 floats (x y z nx ny nz)
// and each triangle is 3 vertices (18 floats), wound counter-clockwise seen from outside.
// ---------------------------------------------------------------
function soupFromArrays(pos, nor, idx, m) {
  const a = m[0], b = m[4], c = m[8], d = m[1], e = m[5], f = m[9], g = m[2], h = m[6], i = m[10];
  const c11 = e * i - f * h, c12 = -(d * i - f * g), c13 = d * h - e * g;
  const c21 = -(b * i - c * h), c22 = a * i - c * g, c23 = -(a * h - b * g);
  const c31 = b * f - c * e, c32 = -(a * f - c * d), c33 = a * e - b * d;
  const sgn = (a * c11 + b * c12 + c * c13) < 0 ? -1 : 1;
  const sk = [];
  const count = idx ? idx.length : pos.length / 3;
  for (let k = 0; k < count; k++) {
    const v = idx ? idx[k] : k, o = v * 3;
    const x = pos[o], y = pos[o + 1], z = pos[o + 2];
    const nx = nor[o], ny = nor[o + 1], nz = nor[o + 2];
    const tx = sgn * (c11 * nx + c12 * ny + c13 * nz), ty = sgn * (c21 * nx + c22 * ny + c23 * nz), tz = sgn * (c31 * nx + c32 * ny + c33 * nz);
    const l = Math.hypot(tx, ty, tz) || 1;
    sk.push(m[0] * x + m[4] * y + m[8] * z + m[12], m[1] * x + m[5] * y + m[9] * z + m[13], m[2] * x + m[6] * y + m[10] * z + m[14], tx / l, ty / l, tz / l);
  }
  return { sk, cp: [] };
}

function lerpV(p, q, t) {
  const r = new Array(6);
  for (let k = 0; k < 6; k++) r[k] = p[k] + (q[k] - p[k]) * t;
  const l = Math.hypot(r[3], r[4], r[5]) || 1;
  r[3] /= l; r[4] /= l; r[5] /= l;
  return r;
}
function pushTri(dst, a, b, c) {
  const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
  const cx = uy * vz - uz * vy, cy = uz * vx - ux * vz, cz = ux * vy - uy * vx;
  if (cx * cx + cy * cy + cz * cz < 1e-16) return;
  dst.push(a[0], a[1], a[2], a[3], a[4], a[5], b[0], b[1], b[2], b[3], b[4], b[5], c[0], c[1], c[2], c[3], c[4], c[5]);
}
function polyEmit(dst, poly) {
  for (let k = 1; k + 1 < poly.length; k++) pushTri(dst, poly[0], poly[k], poly[k + 1]);
}

// Order the points where the plane crosses the solid into a convex polygon (counter-clockwise
// seen from the +normal side) and find its centre.
function capLoop(raw, nx, ny, nz) {
  const pts = [];
  for (const p of raw) {
    let dup = false;
    for (const q of pts) if (Math.abs(p[0] - q[0]) + Math.abs(p[1] - q[1]) + Math.abs(p[2] - q[2]) < 3e-5) { dup = true; break; }
    if (!dup) pts.push(p);
  }
  if (pts.length < 3) return null;
  let cx = 0, cy = 0, cz = 0;
  for (const p of pts) { cx += p[0]; cy += p[1]; cz += p[2]; }
  cx /= pts.length; cy /= pts.length; cz /= pts.length;
  let ux = pts[0][0] - cx, uy = pts[0][1] - cy, uz = pts[0][2] - cz;
  const dn = ux * nx + uy * ny + uz * nz;
  ux -= dn * nx; uy -= dn * ny; uz -= dn * nz;
  const ul = Math.hypot(ux, uy, uz);
  if (ul < 1e-9) return null;
  ux /= ul; uy /= ul; uz /= ul;
  const vx = ny * uz - nz * uy, vy = nz * ux - nx * uz, vz = nx * uy - ny * ux;
  const ang = pts.map(p => {
    const dx = p[0] - cx, dy = p[1] - cy, dz = p[2] - cz;
    return Math.atan2(dx * vx + dy * vy + dz * vz, dx * ux + dy * uy + dz * uz);
  });
  const order = pts.map((_, i) => i).sort((a, b) => ang[a] - ang[b]);
  const poly = order.map(i => pts[i]);
  let ax = 0, ay = 0, az = 0, area2 = 0;
  for (let i = 0; i < poly.length; i++) {
    const p = poly[i], q = poly[(i + 1) % poly.length];
    const e1x = p[0] - cx, e1y = p[1] - cy, e1z = p[2] - cz, e2x = q[0] - cx, e2y = q[1] - cy, e2z = q[2] - cz;
    const a2 = (e1y * e2z - e1z * e2y) * nx + (e1z * e2x - e1x * e2z) * ny + (e1x * e2y - e1y * e2x) * nz;
    area2 += a2;
    ax += a2 * (cx + p[0] + q[0]) / 3; ay += a2 * (cy + p[1] + q[1]) / 3; az += a2 * (cz + p[2] + q[2]) / 3;
  }
  if (area2 < 1e-9) return null;
  return { poly, cen: [ax / area2, ay / area2, az / area2], area: area2 / 2 };
}
function capTris(dst, poly, cen, ox, oy, oz, ccw) {
  for (let i = 0; i < poly.length; i++) {
    const p = poly[i], q = poly[(i + 1) % poly.length];
    const C = [cen[0], cen[1], cen[2], ox, oy, oz], P = [p[0], p[1], p[2], ox, oy, oz], Q = [q[0], q[1], q[2], ox, oy, oz];
    if (ccw) pushTri(dst, C, P, Q); else pushTri(dst, C, Q, P);
  }
}

// Slice a convex solid with the plane n.p + c = 0. A keeps n.p + c >= 0, B keeps the rest.
// Both halves get a flat cut face. With capped=false (open shells such as hair) there is no face.
// Returns null when the plane misses the solid.
function clipSoup(soup, nx, ny, nz, c, capped = true) {
  const A = { sk: [], cp: [] }, B = { sk: [], cp: [] };
  const raw = [];
  const EPS = 1e-7;
  for (const key of ['sk', 'cp']) {
    const src = soup[key];
    for (let t = 0; t < src.length; t += 18) {
      const V = [src.slice(t, t + 6), src.slice(t + 6, t + 12), src.slice(t + 12, t + 18)];
      const S = [0, 1, 2].map(k => nx * V[k][0] + ny * V[k][1] + nz * V[k][2] + c);
      const anyP = S[0] > EPS || S[1] > EPS || S[2] > EPS;
      const anyN = S[0] < -EPS || S[1] < -EPS || S[2] < -EPS;
      if (!anyP && !anyN) continue;                      // lies in the plane
      for (let k = 0; k < 3; k++) if (Math.abs(S[k]) <= EPS) raw.push([V[k][0], V[k][1], V[k][2]]);
      if (!anyN) { polyEmit(A[key], V); continue; }
      if (!anyP) { polyEmit(B[key], V); continue; }
      const pa = [], pb = [];
      for (let k = 0; k < 3; k++) {
        const j = (k + 1) % 3, s0 = S[k], s1 = S[j];
        if (s0 >= 0) pa.push(V[k]);
        if (s0 <= 0) pb.push(V[k]);
        if ((s0 > 0 && s1 < 0) || (s0 < 0 && s1 > 0)) {
          const p = lerpV(V[k], V[j], s0 / (s0 - s1));
          pa.push(p); pb.push(p);
          raw.push([p[0], p[1], p[2]]);
        }
      }
      polyEmit(A[key], pa); polyEmit(B[key], pb);
    }
  }
  // the plane only cuts the solid if both sides ended up with some surface (it can run along
  // mesh edges without any triangle straddling it)
  if (A.sk.length + A.cp.length === 0 || B.sk.length + B.cp.length === 0) return null;
  let loop = { poly: [], cen: [0, 0, 0], area: 0 };
  if (capped) {
    loop = capLoop(raw, nx, ny, nz);
    if (!loop) return null;
    capTris(A.cp, loop.poly, loop.cen, -nx, -ny, -nz, false);
    capTris(B.cp, loop.poly, loop.cen, nx, ny, nz, true);
  }
  return { A, B, poly: loop.poly, cen: loop.cen, area: loop.area };
}

function soupMassProps(soup) {
  let vol = 0, cx = 0, cy = 0, cz = 0;
  for (const key of ['sk', 'cp']) {
    const s = soup[key];
    for (let t = 0; t < s.length; t += 18) {
      const ax = s[t], ay = s[t + 1], az = s[t + 2], bx = s[t + 6], by = s[t + 7], bz = s[t + 8], qx = s[t + 12], qy = s[t + 13], qz = s[t + 14];
      const v6 = (ax * (by * qz - bz * qy) - ay * (bx * qz - bz * qx) + az * (bx * qy - by * qx)) / 6;
      vol += v6;
      cx += (ax + bx + qx) / 4 * v6; cy += (ay + by + qy) / 4 * v6; cz += (az + bz + qz) / 4 * v6;
    }
  }
  if (Math.abs(vol) < 1e-12) return { vol: 0, cx: 0, cy: 0, cz: 0 };
  return { vol, cx: cx / vol, cy: cy / vol, cz: cz / vol };
}

// Half-space form of a convex solid: n.p <= d for every plane, stored as nx ny nz d.
function soupPlanes(soup) {
  const seen = new Set(), out = [];
  for (const key of ['sk', 'cp']) {
    const s = soup[key];
    for (let t = 0; t < s.length; t += 18) {
      const ax = s[t], ay = s[t + 1], az = s[t + 2];
      const e1x = s[t + 6] - ax, e1y = s[t + 7] - ay, e1z = s[t + 8] - az, e2x = s[t + 12] - ax, e2y = s[t + 13] - ay, e2z = s[t + 14] - az;
      let nx = e1y * e2z - e1z * e2y, ny = e1z * e2x - e1x * e2z, nz = e1x * e2y - e1y * e2x;
      const l = Math.hypot(nx, ny, nz);
      if (l < 1e-9) continue;
      nx /= l; ny /= l; nz /= l;
      const d = nx * ax + ny * ay + nz * az;
      const k = Math.round(nx * 400) + ',' + Math.round(ny * 400) + ',' + Math.round(nz * 400) + ',' + Math.round(d * 1000);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push(nx, ny, nz, d);

  }

// Does the segment a->b pass through the solid? Fills out.t0/out.t1 with the part inside.
function segSolid(pl, ax, ay, az, bx, by, bz, out) {

    const nx = pl[i], ny = pl[i + 1], nz = pl[i + 2];
    const num = pl[i + 3] - (nx * ax + ny * ay + nz * az);
    const den = nx * dx + ny * dy + nz * dz;
    if (den > -1e-12 && den < 1e-12) { if (num < 0) return false; continue; }
    const t = num / den;
    if (den > 0) { if (t < t1) t1 = t; } else if (t > t0) t0 = t;
    if (t0 > t1) return false;
  }

}
// Distance from a point inside the solid to its nearest face.
function solidDepth(pl, x, y, z) {

  for (let i = 0; i < pl.length; i += 4) {
    const v = pl[i + 3] - (pl[i] * x + pl[i + 1] * y + pl[i + 2] * z);
    if (v < m) m = v;
  }

}
// Shoot a ray from a point inside the solid and find where it leaves, plus that face's normal.
function rayExit(pl, ox, oy, oz, dx, dy, dz, out) {

  for (let i = 0; i < pl.length; i += 4) {
    const den = pl[i] * dx + pl[i + 1] * dy + pl[i + 2] * dz;
    if (den < 1e-9) continue;
    const t = (pl[i + 3] - (pl[i] * ox + pl[i + 1] * oy + pl[i + 2] * oz)) / den;
    if (t < best) { best = t; bi = i; }
  }
  if (bi < 0) return false;
  out.t = Math.max(0, best); out.nx = pl[bi]; out.ny = pl[bi + 1]; out.nz = pl[bi + 2];
  return true;
}
function soupPoints(soup, q) {
  const seen = new Set(), out = [];
  for (const key of ['sk', 'cp']) {
    const s = soup[key];
    for (let t = 0; t < s.length; t += 6) {
      const k = Math.round(s[t] / q) + ',' + Math.round(s[t + 1] / q) + ',' + Math.round(s[t + 2] / q);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push(s[t], s[t + 1], s[t + 2]);
    }
  }
  return new Float32Array(out);
}
function soupBounds(soup) {
  const mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9];
  let reach = 0;
  for (const key of ['sk', 'cp']) {
    const s = soup[key];
    for (let t = 0; t < s.length; t += 6) {
      for (let k = 0; k < 3; k++) { if (s[t + k] < mn[k]) mn[k] = s[t + k]; if (s[t + k] > mx[k]) mx[k] = s[t + k]; }
      reach = Math.max(reach, Math.hypot(s[t], s[t + 1], s[t + 2]));
    }
  }
  return { mn, mx, reach };
}
function soupToArrays(soup) {
  const nSk = soup.sk.length / 6, nCp = soup.cp.length / 6;
  const pos = new Float32Array((nSk + nCp) * 3), nor = new Float32Array((nSk + nCp) * 3);
  let o = 0;
  for (const key of ['sk', 'cp']) {
    const s = soup[key];
    for (let t = 0; t < s.length; t += 6) {
      pos[o] = s[t]; pos[o + 1] = s[t + 1]; pos[o + 2] = s[t + 2];
      nor[o] = s[t + 3]; nor[o + 1] = s[t + 4]; nor[o + 2] = s[t + 5];
      o += 3;
    }
  }
  return { pos, nor, nSk, nCp };
}

function makeFinger(mat, lens, w) {

  const mid = new THREE.Group(); mid.position.z = -lens[0]; root.add(mid);
  const s2 = new THREE.Mesh(new THREE.BoxGeometry(w * 0.92, w * 0.92, lens[1]), mat);
  s2.position.z = -lens[1] / 2; s2.castShadow = true; mid.add(s2);
  return { root, mid };
}
function buildHandMesh(isLeft) {
  const root = new THREE.Group();
  const model = new THREE.Group();     // built as a right hand; mirrored for the left
  if (isLeft) model.scale.x = -1;
  root.add(model);

  thumb.root.position.set(-0.004, 0.046, -0.03);
  thumb.root.rotation.y = 0.35;
  model.add(thumb.root);
  return { root, fingers, thumb };
}
function setCurl(vis, grip, index) {

function poolTexture() {

function makeDecalSet(tex, cap) {
  const mat = new THREE.MeshStandardMaterial({
    map: tex, transparent: true, depthWrite: false, roughness: 0.16, metalness: 0,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2
  });
  const mesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), mat, cap);
  mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(cap * 3).fill(1), 3);
  for (let i = 0; i < cap; i++) mesh.setMatrixAt(i, ZERO_M);
  mesh.frustumCulled = false; mesh.receiveShadow = true;
  scene.add(mesh);
  return { mesh, cap, next: 0, dirty: false };
}
const bigSplats = [makeDecalSet(splatTexture(), 90), makeDecalSet(splatTexture(), 90), makeDecalSet(splatTexture(), 90)];
const smallDrops = makeDecalSet(dropTexture(), 260);
const poolSet = makeDecalSet(poolTexture(), 24);

function placeDecal(set, pos, normal, size, shade) {
  const i = set.next++ % set.cap;
  _pq.setFromUnitVectors(Z_AXIS, normal);
  _pq.multiply(new THREE.Quaternion().setFromAxisAngle(Z_AXIS, Math.random() * 6.283));
  _ps.set(size, size, 1);
  _m4.compose(pos, _pq, _ps);
  set.mesh.setMatrixAt(i, _m4);
  const c = set.mesh.instanceColor.array;
  c[i * 3] = c[i * 3 + 1] = c[i * 3 + 2] = shade;
  set.mesh.instanceColor.needsUpdate = true;
  set.dirty = true;
  return i;
}
function setDecalMatrix(set, i, pos, normal, size, spin) {
  _pq.setFromUnitVectors(Z_AXIS, normal);
  _pq.multiply(new THREE.Quaternion().setFromAxisAngle(Z_AXIS, spin));
  _ps.set(size, size, 1);
  _m4.compose(pos, _pq, _ps);
  set.mesh.setMatrixAt(i, _m4);
  set.dirty = true;
}
function clearDecalSet(set) {

  set.next = 0; set.dirty = true;
}

// Droplets
const MAXP = 450;
const pPos = new Float32Array(MAXP * 3), pVel = new Float32Array(MAXP * 3);
const pLife = new Float32Array(MAXP), pSize = new Float32Array(MAXP);
const bloodMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 6, 4),
  new THREE.MeshStandardMaterial({ color: 0x6a0909, roughness: 0.1, metalness: 0.15 }), MAXP);
for (let i = 0; i < MAXP; i++) bloodMesh.setMatrixAt(i, ZERO_M);
bloodMesh.frustumCulled = false;
scene.add(bloodMesh);
let pNext = 0;

const _sv = new THREE.Vector3();
function spawnBlood(pos, dir, count, speed, spread, size) {
  _sv.copy(dir).normalize();
  for (let n = 0; n < count; n++) {
    const i = pNext++ % MAXP, i3 = i * 3;
    const sp = speed * rnd(0.45, 1.15);
    pVel[i3] = _sv.x * sp + rnd(-1, 1) * spread * speed * 0.5;
    pVel[i3 + 1] = _sv.y * sp + rnd(-0.3, 1) * spread * speed * 0.5;
    pVel[i3 + 2] = _sv.z * sp + rnd(-1, 1) * spread * speed * 0.5;
    pPos[i3] = pos.x + rnd(-0.01, 0.01); pPos[i3 + 1] = pos.y + rnd(-0.01, 0.01); pPos[i3 + 2] = pos.z + rnd(-0.01, 0.01);
    pLife[i] = rnd(1.2, 2.6);
    pSize[i] = size * rnd(0.45, 1.25);
  }
}
function killDrop(i) { pLife[i] = 0; bloodMesh.setMatrixAt(i, ZERO_M); }
const _dn = new THREE.Vector3(), _dp = new THREE.Vector3();
function dropHit(x, y, z, nx, ny, nz, size) {
  if (size < 0.007 && Math.random() < 0.5) return;
  _dn.set(nx, ny, nz); _dp.set(x, y, z);
  if (size > 0.009) {
    const set = bigSplats[(Math.random() * bigSplats.length) | 0];
    placeDecal(set, _dp, _dn, 0.07 + size * 8 + rnd(0, 0.04), rnd(0.55, 1));
  } else {
    placeDecal(smallDrops, _dp, _dn, 0.035 + size * 4, rnd(0.55, 1));
  }
}
function updateDrops(dt) {
  let any = false;
  for (let i = 0; i < MAXP; i++) {
    if (pLife[i] <= 0) continue;
    any = true;
    const i3 = i * 3;
    pVel[i3 + 1] -= 9.8 * dt;
    const drag = 1 - 0.35 * dt;
    pVel[i3] *= drag; pVel[i3 + 1] *= drag; pVel[i3 + 2] *= drag;
    pPos[i3] += pVel[i3] * dt; pPos[i3 + 1] += pVel[i3 + 1] * dt; pPos[i3 + 2] += pVel[i3 + 2] * dt;
    pLife[i] -= dt;
    const x = pPos[i3], y = pPos[i3 + 1], z = pPos[i3 + 2];
    if (pLife[i] <= 0) { killDrop(i); continue; }
    const gy = groundAt(x, z);
    if (y <= gy + 0.003) { dropHit(x, gy + 0.003, z, 0, 1, 0, pSize[i]); killDrop(i); continue; }
    if (y < WALL_H) {
      if (x > HALF - 0.004) { dropHit(HALF - 0.004, y, z, -1, 0, 0, pSize[i]); killDrop(i); continue; }
      if (x < -HALF + 0.004) { dropHit(-HALF + 0.004, y, z, 1, 0, 0, pSize[i]); killDrop(i); continue; }
      if (z > HALF - 0.004) { dropHit(x, y, HALF - 0.004, 0, 0, -1, pSize[i]); killDrop(i); continue; }
      if (z < -HALF + 0.004) { dropHit(x, y, -HALF + 0.004, 0, 0, 1, pSize[i]); killDrop(i); continue; }
    }
    const vx = pVel[i3], vy = pVel[i3 + 1], vz = pVel[i3 + 2];
    const sp = Math.sqrt(vx * vx + vy * vy + vz * vz);
    _pp.set(x, y, z);
    if (sp > 0.01) _pq.setFromUnitVectors(Z_AXIS, _sv.set(vx / sp, vy / sp, vz / sp)); else _pq.identity();
    const s = pSize[i];
    _ps.set(s, s, s * (1 + Math.min(sp * 0.2, 3.5)));
    _m4.compose(_pp, _pq, _ps);
    bloodMesh.setMatrixAt(i, _m4);
  }
  if (any) bloodMesh.instanceMatrix.needsUpdate = true;
}

const MAXC = 56;
const chunkMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1),

const chunks = [];

let cNext = 0;
function spawnChunks(pos, dir, n, bone) {
  for (let k = 0; k < n; k++) {
    const i = cNext++ % MAXC, c = chunks[i];
    c.life = rnd(18, 28); c.rest = false;
    c.p.copy(pos);
    c.v.copy(dir).multiplyScalar(rnd(1.5, 4)).add(_sv.set(rnd(-1.5, 1.5), rnd(0.5, 3), rnd(-1.5, 1.5)));
    c.q.setFromAxisAngle(_sv.set(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).normalize(), rnd(0, 6));
    c.av.set(rnd(-9, 9), rnd(-9, 9), rnd(-9, 9));
    const sz = bone ? rnd(0.012, 0.028) : rnd(0.02, 0.05);
    c.s.set(sz * rnd(0.7, 1.4), sz * rnd(0.5, 1), sz * rnd(0.8, 1.6));
    const col = chunkMesh.instanceColor.array;
    const pick = bone && Math.random() < 0.7 ? [0.9, 0.87, 0.78] : (Math.random() < 0.5 ? [0.55, 0.07, 0.07] : [0.7, 0.18, 0.16]);
    col[i * 3] = pick[0]; col[i * 3 + 1] = pick[1]; col[i * 3 + 2] = pick[2];
    chunkMesh.instanceColor.needsUpdate = true;
  }
}
function updateChunks(dt) {
  let any = false;
  for (let i = 0; i < MAXC; i++) {
    const c = chunks[i];
    if (c.life <= 0) continue;
    any = true;
    c.life -= dt;
    if (c.life <= 0) { chunkMesh.setMatrixAt(i, ZERO_M); continue; }
    if (!c.rest) {
      c.v.y -= 9.8 * dt;

  const spin = Math.random() * 6.283;

  const ss = clamp(0.07 + dmg * 0.0018, 0.07, 0.24);

  L.group.add(stain);

function severLimb(L, dir) {

  addStump(L, new THREE.Vector3(0, 0, 0), cNormal, def.cap[0], def.cap[1]);

  addBleeder(P, plp, pNormal, 1.0, rnd(11, 16), true);

function crushHead(L, hitPos, dir) {
  if (L.crushed || L.baked) return;

    for (const L of g.limbList) {

const capSkinMat = new THREE.MeshStandardMaterial({ color: 0xd49a82, roughness: 0.4 });
const capBoneMat = new THREE.MeshStandardMaterial({ color: 0xe4dbc3, roughness: 0.4 });
const capFillMat = new THREE.MeshStandardMaterial({ map: cutTexture(false), roughness: 0.2, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });

  geo.setAttribute('position', new THREE.BufferAttribute(a.pos, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(a.nor, 3));

// planes of an un-sliced limb (alive guys and fresh ragdolls), built lazily
function ensurePlanes(L) {

function limbReach(L) {

    ch.updateMatrix();

function distPointSeg(p, a, b) {
  const abx = b.x - a.x, aby = b.y - a.y, abz = b.z - a.z;
  const l2 = abx * abx + aby * aby + abz * abz;
  const t = l2 > 0 ? clamp(((p.x - a.x) * abx + (p.y - a.y) * aby + (p.z - a.z) * abz) / l2, 0, 1) : 0;
  return Math.hypot(a.x + abx * t - p.x, a.y + aby * t - p.y, a.z + abz * t - p.z);

function addCapDecor(L, poly, cen, outN) {

    sx += ay * bz - az * by; sy += az * bx - ax * bz; sz += ax * by - ay * bx;
  }
  const P = poly.map(p => new THREE.Vector3(p[0], p[1], p[2]));

  for (let i = 0; i < m; i++) rin = Math.min(rin, distPointSeg(cen, P[i], P[(i + 1) % m]));
  rin = clamp(rin, 0.008, 0.2);

  u.addScaledVector(outN, -u.dot(outN));

    nor[idx * 3] = outN.x; nor[idx * 3 + 1] = outN.y; nor[idx * 3 + 2] = outN.z;
    uv[idx * 2] = 0.5 + (dx * u.x + dy * u.y + dz * u.z) * inv;
    uv[idx * 2 + 1] = 0.5 + (dx * v.x + dy * v.y + dz * v.z) * inv;

    const a = P[i], b = P[(i + 1) % m];
    put(i * 3, 0, 0, 0);
    put(i * 3 + 1, (a.x - cen.x) * k, (a.y - cen.y) * k, (a.z - cen.z) * k);
    put(i * 3 + 2, (b.x - cen.x) * k, (b.y - cen.y) * k, (b.z - cen.z) * k);

  mesh.userData.ownGeo = true;

}

  const f = frontPoint(2.3);
  headWorld(_hw);
  spawnGuy(f.x, f.z, mode, Math.atan2(_hw.x - f.x, _hw.z - f.z));
}
function spawnGroup() {
  const modes = ['stand', 'wander', 'fight', 'wander'];
  const base = frontPoint(2.8);
  headWorld(_hw);
  modes.forEach((m, i) => {
    const x = clamp(base.x + (i - 1.5) * 0.9, -HALF + 0.5, HALF - 0.5);
    spawnGuy(x, base.z, m, Math.atan2(_hw.x - x, _hw.z - base.z));
  });
}
function resetAll() {
  for (const h of hands) releaseHand(h);
  clearGuys();
  clearSpawned();
  clearBlood();
  for (const p of props) {
    p.body.setTranslation(p.initPos, true);
    p.body.setRotation(p.initRot, true);
    p.body.setLinvel({ x: 0, y: 0, z: 0 }, true);
    p.body.setAngvel({ x: 0, y: 0, z: 0 }, true);
    p.blood = 0; applyBlood(p);
  }
}

// ---------------------------------------------------------------
// Spawn menu (floating panel, laser pointers, trigger to click)
// ---------------------------------------------------------------
const settings = { vignette: true, snapTurn: true };
const MENU_W = 1100, MENU_H = 760;
const TABS = ['People', 'Weapons', 'Props', 'Settings'];
const menu = {
  open: false, tab: 0, hover: null, buttons: [], tabRects: [],
  canvas: document.createElement('canvas')
};
menu.canvas.width = MENU_W; menu.canvas.height = MENU_H;
menu.tex = new THREE.CanvasTexture(menu.canvas);
menu.tex.colorSpace = THREE.SRGBColorSpace;
menu.mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.9 * MENU_H / MENU_W),
  new THREE.MeshBasicMaterial({ map: menu.tex, transparent: true, toneMapped: false, side: THREE.DoubleSide }));
menu.mesh.visible = false;
scene.add(menu.mesh);

function tabButtons(tab) {
  if (tab === 0) return [
    { label: 'Guy: stands still', act: () => spawnGuyFront('stand') },
    { label: 'Guy: wanders', act: () => spawnGuyFront('wander') },
    { label: 'Guy: fights back', act: () => spawnGuyFront('fight') },
    { label: 'Group of 4', act: spawnGroup },
    { label: 'Clear all people', act: clearGuys }
  ];
  if (tab === 1) return [
    { label: 'Knife', act: () => spawnWeaponFront('knife') },
    { label: 'Sword', act: () => spawnWeaponFront('sword') },
    { label: 'Axe', act: () => spawnWeaponFront('axe') },
    { label: 'Sledgehammer', act: () => spawnWeaponFront('hammer') },
    { label: 'Baseball bat', act: () => spawnWeaponFront('bat') },
    { label: 'Clear spawned items', act: clearSpawned }
  ];
  if (tab === 2) return [
    { label: 'Crate', act: () => { menuSpawns.crate(); trimSpawned(); } },
    { label: 'Small crate', act: () => { menuSpawns.smallCrate(); trimSpawned(); } },
    { label: 'Barrel', act: () => { menuSpawns.barrel(); trimSpawned(); } },
    { label: 'Ball', act: () => { menuSpawns.ball(); trimSpawned(); } },
    { label: 'Heavy block', act: () => { menuSpawns.heavy(); trimSpawned(); } },
    { label: 'Plank', act: () => { menuSpawns.plank(); trimSpawned(); } },
    { label: 'Clear spawned items', act: clearSpawned }
  ];
  return [
    { label: () => 'Comfort vignette: ' + (settings.vignette ? 'ON' : 'OFF'), act: () => { settings.vignette = !settings.vignette; }, on: () => settings.vignette },
    { label: () => 'Turning: ' + (settings.snapTurn ? 'SNAP' : 'SMOOTH'), act: () => { settings.snapTurn = !settings.snapTurn; } },
    { label: () => 'Hand tilt: ' + Math.round(handPitch * 180 / Math.PI) + '°', act: () => {}, info: true },
    { label: 'Tilt hands down', act: () => { handPitch -= Math.PI / 36; saveTilt(); } },
    { label: 'Tilt hands up', act: () => { handPitch += Math.PI / 36; saveTilt(); } },
    { label: 'Clear blood', act: clearBlood },
    { label: 'Clear everything', act: () => { clearGuys(); clearSpawned(); clearBlood(); } },
    { label: 'Reset everything', act: resetAll }
  ];
}
function saveTilt() { try { localStorage.setItem('arena_hand_pitch', String(handPitch)); } catch (e) {} }

function layoutMenu() {
  menu.tabRects = TABS.map((t, i) => ({ x: 30 + i * 262, y: 28, w: 252, h: 84, i }));
  const list = tabButtons(menu.tab);
  menu.buttons = list.map((b, i) => ({
    ...b, x: 30 + (i % 3) * 355, y: 148 + Math.floor(i / 3) * 178, w: 330, h: 150
  }));
}
function drawMenu() {
  layoutMenu();
  const g = menu.canvas.getContext('2d');
  g.clearRect(0, 0, MENU_W, MENU_H);
  g.fillStyle = 'rgba(14,18,24,0.95)'; g.beginPath(); g.roundRect(0, 0, MENU_W, MENU_H, 40); g.fill();
  g.strokeStyle = '#ff8a2a'; g.lineWidth = 8; g.beginPath(); g.roundRect(6, 6, MENU_W - 12, MENU_H - 12, 36); g.stroke();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const t of menu.tabRects) {
    const active = t.i === menu.tab, hov = menu.hover === 't' + t.i;
    g.fillStyle = active ? '#ff8a2a' : hov ? '#3a4a66' : '#1f2938';
    g.beginPath(); g.roundRect(t.x, t.y, t.w, t.h, 20); g.fill();
    g.fillStyle = active ? '#101318' : '#ffffff'; g.font = 'bold 40px system-ui, sans-serif';
    g.fillText(TABS[t.i], t.x + t.w / 2, t.y + t.h / 2 + 2);
  }
  menu.buttons.forEach((b, i) => {
    const hov = menu.hover === 'b' + i;
    const on = b.on && b.on();
    g.fillStyle = b.info ? '#18202c' : hov ? '#3d6aa8' : on ? '#2c5a3a' : '#26344b';
    g.beginPath(); g.roundRect(b.x, b.y, b.w, b.h, 22); g.fill();
    g.fillStyle = '#ffffff'; g.font = '38px system-ui, sans-serif';
    const text = typeof b.label === 'function' ? b.label() : b.label;
    const words = text.split(' ');
    if (text.length > 14 && words.length > 1) {
      const mid = Math.ceil(words.length / 2);
      g.fillText(words.slice(0, mid).join(' '), b.x + b.w / 2, b.y + b.h / 2 - 24);
      g.fillText(words.slice(mid).join(' '), b.x + b.w / 2, b.y + b.h / 2 + 24);
    } else g.fillText(text, b.x + b.w / 2, b.y + b.h / 2);
  });
  g.fillStyle = '#9fb3c8'; g.font = '30px system-ui, sans-serif';
  g.fillText(`People: ${guys.length}   Items spawned: ${props.filter(p => !p.initial).length}`, MENU_W / 2, 708);
  menu.tex.needsUpdate = true;
}
function hitMenu(px, py) {
  for (const t of menu.tabRects) if (px >= t.x && px <= t.x + t.w && py >= t.y && py <= t.y + t.h) return 't' + t.i;
  for (let i = 0; i < menu.buttons.length; i++) {
    const b = menu.buttons[i];
    if (!b.info && px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) return 'b' + i;
  }
  return null;
}
function openMenu(open) {
  menu.open = open;
  menu.mesh.visible = open;
  if (open) {
    headWorld(_hw);
    camera.getWorldDirection(_fwd); _fwd.y = 0;
    if (_fwd.lengthSq() < 1e-6) _fwd.set(0, 0, -1);
    _fwd.normalize();
    menu.mesh.position.set(_hw.x + _fwd.x * 0.8, _hw.y - 0.15, _hw.z + _fwd.z * 0.8);
    menu.mesh.lookAt(_hw.x, _hw.y - 0.1, _hw.z);
    menu.mesh.updateMatrixWorld(true);
    menu.hover = null;
    drawMenu();
  }
  for (const side of ['left', 'right']) if (slots[side]) slots[side].laser.visible = open;
}
const raycaster = new THREE.Raycaster();
const _ro = new THREE.Vector3(), _rd = new THREE.Vector3();
function menuPointer(side) {
  const slot = slots[side];
  if (!slot) return null;
  slot.ctrl.getWorldPosition(_ro);
  _rd.set(0, 0, -1).transformDirection(slot.ctrl.matrixWorld);
  raycaster.set(_ro, _rd); raycaster.far = 3;
  const hit = raycaster.intersectObject(menu.mesh, false)[0];
  slot.laser.scale.z = hit ? hit.distance : 1.5;
  if (!hit || !hit.uv) return null;
  return { px: hit.uv.x * MENU_W, py: (1 - hit.uv.y) * MENU_H };
}
function updateMenu() {
  if (!menu.open) return;
  let newHover = null;
  for (const side of ['left', 'right']) {
    const pt = menuPointer(side);
    const h = pt ? hitMenu(pt.px, pt.py) : null;
    if (h && !newHover) newHover = h;
    if (h && justPressed(side, 0)) {
      if (h[0] === 't') { menu.tab = parseInt(h.slice(1), 10); }
      else { const b = menu.buttons[parseInt(h.slice(1), 10)]; if (b) b.act(); }
      try { const gp = pad(side); if (gp && gp.hapticActuators && gp.hapticActuators[0]) gp.hapticActuators[0].pulse(0.4, 40); } catch (e) {}
      menu.hover = null; drawMenu();
    } else if (!h) justPressed(side, 0);
  }
  if (newHover !== menu.hover) { menu.hover = newHover; drawMenu(); }
}

// ---------------------------------------------------------------
// Input and player
// ---------------------------------------------------------------
const slots = { left: null, right: null };
const handObjs = {};
const prevBtn = {};
let vigOpacity = 0, snapLatch = false;

function setupControllers() {
  for (let i = 0; i < 2; i++) {
    const ctrl = renderer.xr.getController(i);
    const grip = renderer.xr.getControllerGrip(i);
    const laser = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)]),
      new THREE.LineBasicMaterial({ color: 0xffb347 }));
    laser.visible = false;
    ctrl.add(laser);
    rig.add(ctrl); rig.add(grip);
    ctrl.addEventListener('connected', (e) => {
      const side = e.data.handedness === 'left' ? 'left' : 'right';
      slots[side] = { src: e.data, grip, ctrl, laser };
      laser.visible = menu.open;
    });
    ctrl.addEventListener('disconnected', () => {
      for (const side of ['left', 'right']) if (slots[side] && slots[side].grip === grip) slots[side] = null;
    });
  }
}
function pad(side) { return slots[side] && slots[side].src && slots[side].src.gamepad ? slots[side].src.gamepad : null; }
function stick(gp) {
  const a = gp.axes;
  let x = a.length >= 4 ? a[2] : a[0], y = a.length >= 4 ? a[3] : a[1];
  if (Math.hypot(x, y) < 0.15) { x = 0; y = 0; }
  return { x, y };
}
function justPressed(side, idx) {
  const gp = pad(side);
  const now = !!(gp && gp.buttons[idx] && gp.buttons[idx].pressed);
  const key = side + idx;
  const was = !!prevBtn[key];
  prevBtn[key] = now;
  return now && !was;
}

function turnAboutHead(a) {
  rig.updateMatrixWorld(true);
  headWorld(_hw);
  rig.rotation.y += a;
  rig.updateMatrixWorld(true);
  headWorld(_hw2);
  rig.position.x += _hw.x - _hw2.x;
  rig.position.z += _hw.z - _hw2.z;
}

function locomotion(dt) {
  let moving = false, turning = false;
  const lp = pad('left'), rp = pad('right');
  if (lp) {
    const s = stick(lp);
    if (s.x || s.y) {
      camera.getWorldDirection(_fwd); _fwd.y = 0;
      if (_fwd.lengthSq() < 1e-6) _fwd.set(0, 0, -1);
      _fwd.normalize();
      _rgt.crossVectors(_fwd, _up);
      const speed = 2.3;
      rig.position.addScaledVector(_fwd, -s.y * speed * dt);
      rig.position.addScaledVector(_rgt, s.x * speed * dt);
      moving = true;
    }
  }
  if (rp) {
    const s = stick(rp);
    if (settings.snapTurn) {
      if (!snapLatch && Math.abs(s.x) > 0.7) { turnAboutHead(-Math.sign(s.x) * Math.PI / 6); snapLatch = true; }
      else if (snapLatch && Math.abs(s.x) < 0.3) snapLatch = false;
    } else if (s.x) {
      turnAboutHead(-s.x * 1.7 * dt); turning = true;
    }
  }
  rig.updateMatrixWorld(true);
  headWorld(_hw);
  const lim = HALF - 0.3;
  rig.position.x += Math.min(Math.max(_hw.x, -lim), lim) - _hw.x;
  rig.position.z += Math.min(Math.max(_hw.z, -lim), lim) - _hw.z;
  headWorld(_hw);
  const gy = groundAt(_hw.x, _hw.z);
  rig.position.y += (gy - rig.position.y) * (1 - Math.exp(-14 * dt));

  const target = settings.vignette && (moving || turning) ? 0.9 : 0;
  vigOpacity += (target - vigOpacity) * (1 - Math.exp(-7 * dt));
  vig.material.opacity = vigOpacity;
  vig.visible = vigOpacity > 0.01;
}

// ---------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------
const PITCH_AXIS = new THREE.Vector3(1, 0, 0);
const _gp = new THREE.Vector3(), _gq = new THREE.Quaternion(), _gs = new THREE.Vector3(), _hpq = new THREE.Quaternion();
let last = performance.now();

function stepSim(dt, targets) {
  runQueuedCuts();
  const n = dt > 1 / 48 ? 2 : 1;
  const sdt = dt / n;
  for (let i = 0; i < n; i++) {
    for (const side in targets) driveHand(handObjs[side], sdt, targets[side].pos, targets[side].quat);
    world.timestep = sdt;
    world.step(eventQueue);
    for (const p of props) if (p.blade) bladeStep(p, sdt);
    const evs = [];
    eventQueue.drainCollisionEvents((h1, h2, started) => { if (started) evs.push(h1, h2); });
    for (let k = 0; k < evs.length; k += 2) {
      const o1 = owners.get(evs[k]), o2 = owners.get(evs[k + 1]);
      if (!o1 || !o2) continue;
      const v1 = o1.kind === 'alive' || o1.kind === 'limb', v2 = o2.kind === 'alive' || o2.kind === 'limb';
      const d1 = o1.kind === 'dealer' || o1.kind === 'hand', d2 = o2.kind === 'dealer' || o2.kind === 'hand';
      if (v1 && d2) processHit(o1, o2);
      else if (v2 && d1) processHit(o2, o1);
    }
  }
}

function frame() {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 1 / 30) || 1 / 72;
  last = now;
  simTime += dt;
  const inXR = renderer.xr.isPresenting;

  if (inXR) locomotion(dt);
  rig.updateMatrixWorld(true);

  const targets = {};
  if (inXR) {
    if (justPressed('right', 4)) resetAll();
    if (justPressed('left', 4)) openMenu(!menu.open);
    if (justPressed('left', 3)) { settings.vignette = !settings.vignette; if (menu.open) drawMenu(); }
    if (justPressed('right', 3)) { settings.snapTurn = !settings.snapTurn; if (menu.open) drawMenu(); }
    updateMenu();
    _hpq.setFromAxisAngle(PITCH_AXIS, handPitch);
    for (const side of ['left', 'right']) {
      const slot = slots[side], hand = handObjs[side], gp = pad(side);
      const ok = slot && slot.grip.visible;
      hand.vis.root.visible = !!ok;
      if (!ok) continue;
      slot.grip.matrixWorld.decompose(_gp, _gq, _gs);
      _gq.multiply(_hpq);
      targets[side] = { pos: _gp.clone(), quat: _gq.clone() };
      const g = gp && gp.buttons[1] ? gp.buttons[1].value : 0;
      const t = gp && gp.buttons[0] ? gp.buttons[0].value : 0;
      if (!hand.gripDown && g > 0.7) { hand.gripDown = true; tryGrab(hand); }
      else if (hand.gripDown && g < 0.4) { hand.gripDown = false; releaseHand(hand); }
      hand.curlG += (g - hand.curlG) * Math.min(1, dt * 18);
      hand.curlI += (Math.max(t, g * 0.9) - hand.curlI) * Math.min(1, dt * 18);
      setCurl(hand.vis, hand.curlG, hand.curlI);
    }
  } else {
    handObjs.left.vis.root.visible = false;
    handObjs.right.vis.root.visible = false;
  }

  updateGuys(dt, inXR);
  recordVel();
  stepSim(dt, targets);
  updateGore(dt);

  for (const p of props) {
    const t = p.body.translation();
    if (t.y < -3 || Math.abs(t.x) > HALF + 2 || Math.abs(t.z) > HALF + 2) {
      p.body.setTranslation(p.initPos, true); p.body.setRotation(p.initRot, true);
      p.body.setLinvel({ x: 0, y: 0, z: 0 }, true); p.body.setAngvel({ x: 0, y: 0, z: 0 }, true);
      continue;
    }
    const r = p.body.rotation();
    p.mesh.position.set(t.x, t.y, t.z);
    p.mesh.quaternion.set(r.x, r.y, r.z, r.w);
  }
  for (const g of guys) {
    if (g.state !== 'ragdoll') continue;
    for (const L of g.limbList) {
      const t = L.body.translation(), r = L.body.rotation();
      L.group.position.set(t.x, t.y, t.z);
      L.group.quaternion.set(r.x, r.y, r.z, r.w);
    }
  }
  for (const side of ['left', 'right']) {
    const h = handObjs[side];
    if (!h.vis.root.visible) continue;
    const t = h.body.translation(), r = h.body.rotation();
    h.vis.root.position.set(t.x, t.y, t.z);
    h.vis.root.quaternion.set(r.x, r.y, r.z, r.w);
  }
  if (hurtAmt > 0) {
    hurtAmt = Math.max(0, hurtAmt - dt * 2.2);
    hurt.material.opacity = hurtAmt * 0.8;
    hurt.visible = hurtAmt > 0.01;
  }
  renderer.render(scene, camera);
}

// ---------------------------------------------------------------
// Start
// ---------------------------------------------------------------
const statusEl = document.getElementById('status');
const errEl = document.getElementById('err');
async function main() {
  statusEl.textContent = 'Loading physics...';
  document.body.appendChild(VRButton.createButton(renderer, { optionalFeatures: ['local-floor'] }));
  await RAPIER.init();
  statusEl.textContent = 'Building the arena...';
  initPhysics();
  buildProps();
  for (const side of ['left', 'right']) {
    const h = createHand();
    h.side = side; h.curlG = 0; h.curlI = 0;
    h.vis = buildHandMesh(side === 'left');
    h.vis.root.visible = false;
    scene.add(h.vis.root);
    handObjs[side] = h;
  }
  // two guys standing around so there is something to hit right away
  spawnGuy(-1.6, -2.4, 'stand', 0.3);
  spawnGuy(1.9, -2.0, 'stand', -0.4);
  setupControllers();
  statusEl.textContent = 'Ready. Press ENTER VR.';
  renderer.setAnimationLoop(frame);
}
main().catch((e) => { statusEl.textContent = 'Failed to start.'; errEl.textContent = String(e && e.stack || e); console.error(e); });
</script>
